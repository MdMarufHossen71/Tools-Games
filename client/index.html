<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale`: capping it blocks pinch zoom, which WCAG 2.2 1.4.4 requires. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolsHub — Browser Workbench</title>
    <meta
      name="description"
      content="Free browser tools and games that run entirely on your device. No accounts, no tracking, no uploads." />
    <meta name="color-scheme" content="light dark" />
    <!-- Fonts are requested in index.css. Preconnecting here starts the TLS
         handshake before the stylesheet is parsed, which removes a round trip
         from the point where Bengali text would otherwise render in a fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
